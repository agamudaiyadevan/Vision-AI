<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050b18">
<title>VISION AI</title>
<style>
:root{color-scheme:dark;--cyan:#52eaff;--blue:#438bff;--muted:#9db4ce}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 38%,#102d4b 0,#081426 38%,#030711 78%);color:#eaf8ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
main{width:min(900px,100%);min-height:100vh;margin:auto;padding:18px 18px 28px;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;font-size:13px;color:var(--muted);letter-spacing:.04em}
header strong{display:block;color:#e8fbff;font-size:15px;letter-spacing:.18em}
header .right{text-align:right}
header span{display:block;margin-top:4px}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:400px;padding:22px 0}
.orb{position:relative;width:min(66vw,310px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;filter:drop-shadow(0 0 25px #1abce877);transition:filter .35s,transform .35s}
.orb:before,.orb:after{content:"";position:absolute;inset:8%;border-radius:50%;border:1px solid #55eaff66;box-shadow:inset 0 0 30px #1abce822,0 0 35px #1abce833}
.orb:after{inset:17%;border-color:#8bbcff66;box-shadow:inset 0 0 35px #438bff33}
.face{width:56%;height:76%;position:relative;border-radius:48% 48% 43% 43%;background:linear-gradient(145deg,#d8fbff 0%,#6ad9f1 18%,#174d82 48%,#08172d 100%);clip-path:polygon(22% 0,78% 0,96% 27%,89% 70%,69% 100%,31% 100%,11% 70%,4% 27%);box-shadow:0 0 45px #4ceaff88;opacity:.9}
.face:before{content:"";position:absolute;left:16%;right:16%;top:35%;height:8%;border-radius:50%;background:linear-gradient(90deg,transparent,#d8ffff,#d8ffff,transparent);box-shadow:0 0 18px #b8ffff}
.face:after{content:"";position:absolute;left:39%;right:39%;top:53%;height:20%;border-left:1px solid #d5fbff99;border-bottom:1px solid #d5fbff99;transform:skewY(-18deg);opacity:.7}
.orb.speaking{filter:drop-shadow(0 0 42px #4ceaff);transform:scale(1.035)}
.orb.speaking:before{box-shadow:inset 0 0 45px #1abce855,0 0 55px #1abce899}
h1{font-size:clamp(25px,6vw,38px);letter-spacing:.22em;margin:16px 0 4px;text-shadow:0 0 18px #42dfff77}
.sub{color:#9fc8df;font-size:12px;letter-spacing:.18em}
.answer{width:min(720px,100%);min-height:64px;max-height:22vh;overflow:auto;margin:16px 0 12px;padding:14px 16px;border:1px solid #4bdcf044;border-radius:15px;background:#07182bc9;color:#e7faff;line-height:1.55;white-space:pre-wrap}
.status{font-size:12px;color:#8ddff0;min-height:20px;text-align:center}
.controls{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap}
button{border:1px solid #4ceaff88;border-radius:999px;background:linear-gradient(135deg,#123e62,#0b1c35);color:#effcff;padding:12px 18px;font-weight:650;cursor:pointer;box-shadow:0 0 18px #1abce822}
button:active{transform:scale(.97)}
button.primary{background:linear-gradient(135deg,#087da0,#1552a4);min-width:66px}
button:disabled{opacity:.45;cursor:not-allowed}
.composer{display:flex;gap:8px;width:min(720px,100%);margin:14px auto 0}
input{min-width:0;flex:1;border:1px solid #4bdcf055;border-radius:999px;padding:13px 16px;background:#07182b;color:white;font-size:15px;outline:none}
footer{text-align:center;color:#67869e;font-size:11px;margin-top:18px}
@media(max-width:420px){main{padding:15px 13px 22px}.stage{min-height:360px}.orb{width:68vw}.answer{font-size:14px}}
</style>
</head>
<body>
<main>
<header>
 <div><strong>VISION AI</strong><span id="clock">--:--:--</span><span id="date">Loading date…</span></div>
 <div class="right"><strong id="weekday">---</strong><span id="festival">Tamil AI Assistant</span></div>
</header>
<section class="stage">
 <div class="orb" id="orb" aria-label="VISION AI holographic avatar"><div class="face"></div></div>
 <h1>VISION AI</h1><div class="sub">YOUR INTELLIGENT ASSISTANT</div>
 <div class="answer" id="answer" aria-live="polite">Hello! I’m VISION AI. Ask me anything.</div>
 <div class="status" id="status">Ready</div>
</section>
<div class="controls">
 <button id="mic" class="primary" aria-label="Start voice input">🎙 Speak</button>
 <button id="stop">Stop voice</button>
 <button id="clear">Clear</button>
</div>
<form class="composer" id="form">
 <input id="prompt" autocomplete="off" placeholder="Type your question…" aria-label="Your question">
 <button type="submit">Send</button>
</form>
<footer>VISION AI · Tamil voice depends on the voices available on this device.</footer>
</main>
<script>
(() => {
 const API = "https://vision-ai-backend.agamudaiyadevan.workers.dev/";
 const $ = id => document.getElementById(id);
 const answer = $("answer"), status = $("status"), orb = $("orb");
 let recognition = null, speaking = false;
 const festivals = {"01-01":"New Year","01-14":"Pongal","01-15":"Thiruvalluvar Day","01-16":"Uzhavar Thirunal","08-15":"Independence Day","01-26":"Republic Day","05-01":"May Day","10-02":"Gandhi Jayanti"};
 function tick(){
  const d=new Date();
  $("clock").textContent=d.toLocaleTimeString("en-IN",{hour12:true});
  $("date").textContent=d.toLocaleDateString("en-IN",{day:"2-digit",month:"long",year:"numeric"});
  $("weekday").textContent=d.toLocaleDateString("en-IN",{weekday:"long"});
  $("festival").textContent=festivals[String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")]||"Ask me anything";
 }
 tick(); setInterval(tick,1000);
 function setStatus(s){status.textContent=s;}
 function stopSpeech(){if("speechSynthesis" in window) speechSynthesis.cancel(); speaking=false;orb.classList.remove("speaking");}
 function speak(text){
  if(!("speechSynthesis" in window)){setStatus("Text-to-speech is not supported in this browser.");return;}
  stopSpeech();
  const u=new SpeechSynthesisUtterance(text);u.lang="ta-IN";u.rate=1.03;u.pitch=1.02;
  u.onstart=()=>{speaking=true;orb.classList.add("speaking");setStatus("Speaking…");};
  u.onend=()=>{speaking=false;orb.classList.remove("speaking");setStatus("Ready");};
  u.onerror=()=>{speaking=false;orb.classList.remove("speaking");setStatus("Voice playback unavailable. Please read the text.");};
  speechSynthesis.speak(u);
 }
 async function ask(q){
  q=q.trim(); if(!q)return;
  $("prompt").value="";answer.textContent="Thinking…";setStatus("Connecting to VISION AI…");
  try{
   const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:q})});
   if(!r.ok)throw new Error("Server error ("+r.status+")");
   const data=await r.json();
   const reply=typeof data.reply==="string"?data.reply:(typeof data.response==="string"?data.response:"I couldn't understand the server response.");
   answer.textContent=reply;setStatus("Response received");speak(reply);
  }catch(e){answer.textContent="I couldn’t connect to the AI service. Please check your internet connection or try again later.\n\n"+e.message;setStatus("Connection problem");}
 }
 $("form").addEventListener("submit",e=>{e.preventDefault();ask($("prompt").value);});
 $("stop").addEventListener("click",stopSpeech);
 $("clear").addEventListener("click",()=>{stopSpeech();answer.textContent="Hello! I’m VISION AI. Ask me anything.";setStatus("Ready");});
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(SR){
  recognition=new SR();recognition.lang="ta-IN";recognition.continuous=false;recognition.interimResults=false;
  recognition.onstart=()=>setStatus("Listening… Speak now");
  recognition.onresult=e=>{const text=e.results[0][0].transcript;$("prompt").value=text;ask(text);};
  recognition.onerror=e=>setStatus("Microphone: "+e.error+". Check Chrome microphone permission.");
  recognition.onend=()=>{if(!speaking&&status.textContent==="Listening… Speak now")setStatus("Ready");};
  $("mic").addEventListener("click",()=>{try{recognition.start();}catch(e){setStatus("Microphone is already active.");}});
 }else{$("mic").disabled=true;$("mic").textContent="Mic unavailable";setStatus("Voice input is not supported here. Please type your question.");}
})();
</script>
</body>
</html>
