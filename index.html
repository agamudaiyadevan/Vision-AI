
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#030b18">
<title>VISION AI</title>

<style>
:root {
  --bg: #030b18;
  --panel: #07182a;
  --blue: #00aaff;
  --cyan: #48dcff;
  --text: #d9f5ff;
  --muted: #8daabd;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(ellipse at center, #09213b 0%, var(--bg) 75%);
  color: var(--text);
  font-family: "Courier New", monospace;
  padding: 14px;
}

.app {
  width: 100%;
  max-width: 650px;
  margin: auto;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 4px;
  border-bottom: 1px solid #164363;
  gap: 10px;
}

.brand {
  color: var(--cyan);
  font-size: 23px;
  letter-spacing: 5px;
  font-weight: bold;
}

.subtitle {
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 2px;
  margin-top: 5px;
}

.status {
  color: #53e6b0;
  font-size: 11px;
  white-space: nowrap;
}

.dashboard {
  position: relative;
  margin-top: 18px;
  min-height: 690px;
  border: 1px solid #164b6c;
  border-radius: 25px;
  overflow: hidden;
  background: linear-gradient(180deg,#071a2d,#020916);
  box-shadow: 0 0 22px #007dba25;
}

.hologram {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 65px 5px 65px;
}

.hologram img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  animation: pulse 4s ease-in-out infinite;
  filter: drop-shadow(0 0 15px #00aaff);
}

@keyframes pulse {
  0%,100% {
    opacity: .78;
    filter: brightness(.85) drop-shadow(0 0 12px #00aaff);
  }
  50% {
    opacity: 1;
    filter: brightness(1.2) drop-shadow(0 0 25px #00cfff);
  }
}

.panel {
  position: absolute;
  z-index: 2;
  background: #041426dd;
  border: 1px solid #087eae;
  border-radius: 14px;
  padding: 12px;
  box-shadow: 0 0 12px #008ac544;
  backdrop-filter: blur(8px);
}

.left-top {
  top: 18px;
  left: 12px;
  width: 47%;
}

.right-top {
  top: 18px;
  right: 12px;
  width: 43%;
  text-align: center;
}

.label {
  color: var(--cyan);
  font-size: 11px;
  letter-spacing: 1px;
}

.time {
  color: #53dfff;
  font-size: clamp(19px,5vw,29px);
  font-weight: bold;
  margin: 8px 0;
}

.date, .day {
  font-size: 12px;
  margin-top: 8px;
  color: var(--text);
}

.day {
  color: var(--cyan);
  font-size: 16px;
  font-weight: bold;
}

.festival {
  margin-top: 12px;
  color: #e8faff;
  font-size: 15px;
  font-weight: bold;
}

.festival small {
  display: block;
  color: var(--muted);
  font-size: 10px;
  margin-top: 5px;
  font-weight: normal;
}

.assistant {
  margin-top: 18px;
  padding: 20px;
  border: 1px solid #164b6c;
  border-radius: 22px;
  background: linear-gradient(145deg,#091d30,#030d1b);
}

.section-label {
  color: var(--cyan);
  letter-spacing: 3px;
  font-size: 12px;
}

h1 {
  font-size: 25px;
  margin: 15px 0 8px;
}

.tamil {
  color: var(--muted);
  font-family: sans-serif;
  font-size: 14px;
  line-height: 1.8;
}

.response {
  min-height: 65px;
  padding: 14px;
  margin-top: 16px;
  border: 1px solid #164b6c;
  border-radius: 12px;
  color: var(--text);
  line-height: 1.6;
  overflow-wrap: anywhere;
}

.mic-area {
  text-align: center;
  margin-top: 20px;
}

.mic {
  width: 82px;
  height: 82px;
  border-radius: 50%;
  border: 2px solid var(--cyan);
  color: white;
  background: radial-gradient(circle,#0876b8,#03152a 70%);
  box-shadow: 0 0 20px #00aaff88;
  font-size: 32px;
  cursor: pointer;
}

.mic:active {
  transform: scale(.94);
}

.mic.listening {
  animation: pulse 1s infinite;
  box-shadow: 0 0 30px #00dfff;
}

.hint {
  color: var(--muted);
  font-size: 12px;
  margin-top: 10px;
}

.input-row {
  display: flex;
  gap: 8px;
  margin-top: 18px;
}

input {
  min-width: 0;
  flex: 1;
  background: #031020;
  border: 1px solid #164b6c;
  border-radius: 10px;
  padding: 13px;
  color: white;
  outline: none;
}

button.send {
  border: 1px solid var(--blue);
  border-radius: 10px;
  background: #063b61;
  color: white;
  padding: 0 17px;
  cursor: pointer;
}

@media(max-width:380px) {
  .panel { padding: 9px; }
  .label { font-size: 9px; }
  .date { font-size: 10px; }
}
</style>
</head>

<body>
<div class="app">

<header class="header">
  <div>
    <div class="brand">VendhanOffl</div>
    <div class="subtitle">Love makes life beautiful</div>
  </div>
  <div class="status">● SYSTEM READY</div>
</header>

<main class="dashboard">

  <div class="hologram">
    <img src="hologram.png" alt="VISION AI Holographic Assistant">
  </div>

  <section class="panel left-top">
    <div class="label">LOCAL TIME</div>
    <div class="time" id="clock">--:--:--</div>
    <div class="date" id="date">Loading...</div>
  </section>

  <section class="panel right-top">
    <div class="label">TODAY</div>
    <div class="day" id="day">Loading...</div>
    <div class="festival" id="festival">
      Checking...
      <small id="festivalInfo"></small>
    </div>
  </section>

</main>

<div class="response" id="response">
    Hello! I am VISION AI. How can I help you?
  </div>

  <div class="mic-area">
    <button class="mic" id="mic" aria-label="Start voice input">
      🎙
    </button>
    <div class="hint" id="hint">TAP TO SPEAK</div>
  </div>

  <div class="input-row">
    <input id="question" type="text"
      placeholder="Type your question...">
    <button class="send" id="send">SEND</button>
  </div>
</section>

</div>

<script>
"use strict";

/* TIME AND DATE */

const clock = document.getElementById("clock");
const dateElement = document.getElementById("date");
const dayElement = document.getElementById("day");

const timezone = "Asia/Kolkata";

function updateClock() {
  const now = new Date();

  clock.textContent = new Intl.DateTimeFormat("en-IN", {
    timeZone: timezone,
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hour12: true
  }).format(now);

  dateElement.textContent =
    new Intl.DateTimeFormat("en-IN", {
      timeZone: timezone,
      day: "2-digit",
      month: "short",
      year: "numeric"
    }).format(now);

  dayElement.textContent =
    new Intl.DateTimeFormat("en-IN", {
      timeZone: timezone,
      weekday: "long"
    }).format(now);

  updateFestival(now);
}

/* 2026 FESTIVAL CALENDAR - INDIA */

const festivals2026 = {
  "2026-11-08": ["Deepavali", "Festival of Lights"],
  "2026-11-15": ["Soora Samharam", "Skanda Sashti"],
  "2026-11-24": ["Karthigai Deepam", "Festival of Lights"]
};

function updateFestival(now) {
  const key = new Intl.DateTimeFormat("en-CA", {
    timeZone: timezone,
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).format(now);

  const festival = festivals2026[key];

  document.getElementById("festival").childNodes[0].textContent =
    festival ? festival[0] : "No Festival";

  document.getElementById("festivalInfo").textContent =
    festival ? festival[1] : "Have a wonderful day!";
}

updateClock();
setInterval(updateClock, 1000);


/* AI BACKEND */

const API_URL =
  "https://vision-ai-backend.agamudaiyadevan.workers.dev/";

const responseBox = document.getElementById("response");
const questionInput = document.getElementById("question");
const sendButton = document.getElementById("send");

async function askAI(message) {
  if (!message.trim()) return;

  responseBox.textContent = "VISION AI is thinking...";
  sendButton.disabled = true;

  try {
    const result = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: message
      })
    });

    if (!result.ok) {
      throw new Error("Backend error: " + result.status);
    }

    const data = await result.json();

    if (!data.reply) {
      throw new Error("No reply received");
    }

    responseBox.textContent = data.reply;

    if ("speechSynthesis" in window) {
      const speech = new SpeechSynthesisUtterance(data.reply);
      speech.lang = "ta-IN";
      speechSynthesis.cancel();
      speechSynthesis.speak(speech);
    }

  } catch (error) {
    responseBox.textContent =
      "Connection error. Please check your backend connection.";
    console.error(error);
  } finally {
    sendButton.disabled = false;
  }
}

sendButton.addEventListener("click", () => {
  askAI(questionInput.value);
});

questionInput.addEventListener("keydown", event => {
  if (event.key === "Enter") {
    askAI(questionInput.value);
  }
});


/* VOICE INPUT */

const micButton = document.getElementById("mic");
const hint = document.getElementById("hint");

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

if (SpeechRecognition) {
  const recognition = new SpeechRecognition();

  recognition.lang = "ta-IN";
  recognition.continuous = false;
  recognition.interimResults = false;

  micButton.addEventListener("click", () => {
    try {
      recognition.start();
    } catch (error) {
      hint.textContent = "PLEASE TRY AGAIN";
    }
  });

  recognition.onstart = () => {
    micButton.classList.add("listening");
    hint.textContent = "LISTENING...";
  };

  recognition.onresult = event => {
    const spokenText =
      event.results[0][0].transcript;

    questionInput.value = spokenText;
    askAI(spokenText);
  };

  recognition.onerror = () => {
    hint.textContent = "VOICE INPUT ERROR";
  };

  recognition.onend = () => {
    micButton.classList.remove("listening");
    hint.textContent = "TAP TO SPEAK";
  };

} else {
  micButton.disabled = true;
  hint.textContent = "VOICE INPUT NOT SUPPORTED";
}
</script>

</body>
</html>
