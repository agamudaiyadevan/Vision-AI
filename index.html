<!doctype html><html lang="ta"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071426"><title>VISION AI</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#153b5e,#071426 55%);color:#f4f8fc;font-family:system-ui,sans-serif}main{max-width:680px;margin:auto;padding:22px 16px 40px}.top,.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.brand{font-size:22px;font-weight:800;letter-spacing:2px;color:#55d9ff}.status{font-size:12px;border:1px solid #1e4165;border-radius:20px;padding:6px 10px}.clock{text-align:center;margin:28px 0}.time{font-size:40px;font-weight:bold}.date,.hint,.small{color:#a9bfd3}.orb-wrap{text-align:center;margin:24px}.orb{width:140px;height:140px;border-radius:50%;border:1px solid #55d9ff;background:radial-gradient(circle,#1c6e98,#0b2440 68%);color:white;font-size:40px;box-shadow:0 0 28px #25bfff66}.hint{text-align:center;margin:12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{padding:14px;border:1px solid #1e4165;border-radius:14px;background:#10233c;color:white;font-size:15px}.primary{background:#087eae;border-color:#45cafa}.panel{background:#0d2037;border:1px solid #1e4165;border-radius:18px;padding:16px;margin-top:14px}.panel h2{font-size:17px;margin:0 0 12px}textarea,input{width:100%;padding:13px;border:1px solid #1e4165;border-radius:12px;background:#07182b;color:white;font:inherit}textarea{min-height:85px}.msg{font-size:13px;color:#8de5b1;margin:8px 0;min-height:20px}.item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid #1c3854}.item button{background:transparent;border:0;color:#ffaaaa}.result{line-height:1.6}.small{font-size:12px;line-height:1.5}
</style></head><body><main>
<div class="top"><div class="brand">VISION AI</div><div class="status" id="mode">ONLINE</div></div>
<div class="clock"><div class="time" id="time">--:--</div><div class="date" id="date"></div></div>
<div class="orb-wrap"><button class="orb" id="mic">◉</button></div><div class="hint" id="hint">மைக்ரோஃபோனை அழுத்திப் பேசுங்கள்</div>
<div class="actions"><button class="btn primary" id="speak">குரலில் பேசு</button><button class="btn" id="google">Google தேடு</button><button class="btn" id="music">தமிழ் பாடல் தேடு</button><button class="btn" id="call">போன் செய்</button></div>
<section class="panel"><h2>உதவியாளரின் பதில்</h2><div class="result" id="reply">வணக்கம்! நான் VISION AI. என்ன உதவி வேண்டும்?</div></section>
<section class="panel"><h2>விரைவு குறிப்பு (Notes)</h2><textarea id="note" placeholder="உங்கள் குறிப்பை இங்கே எழுதுங்கள்..."></textarea><button class="btn primary" id="saveNote" style="width:100%;margin-top:9px">குறிப்பைச் சேமி</button><div class="msg" id="noteMsg" role="status"></div><div id="notes"></div></section>
<section class="panel"><h2>நினைவூட்டல்</h2><input id="remText" placeholder="எதை நினைவூட்ட வேண்டும்?"><input id="remTime" type="datetime-local" style="margin-top:8px"><button class="btn primary" id="addRem" style="width:100%;margin-top:8px">நினைவூட்டலைச் சேர்</button><div class="small">இந்த மாதிரியில் பக்கம் திறந்திருக்கும் போது மட்டுமே நினைவூட்டல் சரிபார்க்கப்படும்.</div><div id="reminders"></div></section>
<p class="small" style="text-align:center">VISION AI • Version 1.1</p></main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
function message(id,t,err=false){$(id).textContent=t;$(id).style.color=err?'#ffaaaa':'#8de5b1'}
function load(k){try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return []}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
function say(t){$('reply').textContent=t;try{if(window.speechSynthesis){let u=new SpeechSynthesisUtterance(t);u.lang='ta-IN';speechSynthesis.cancel();speechSynthesis.speak(u)}}catch(e){}}
function clock(){let d=new Date();$('time').textContent=d.toLocaleTimeString('ta-IN');$('date').textContent=d.toLocaleDateString('ta-IN',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}
clock();setInterval(clock,1000);
let notes=load('vision_notes');
function renderNotes(){let root=$('notes');root.replaceChildren();notes.forEach((n,i)=>{let row=document.createElement('div');row.className='item';let s=document.createElement('span');s.textContent=n;let b=document.createElement('button');b.textContent='நீக்கு';b.onclick=()=>{notes.splice(i,1);save('vision_notes',notes);renderNotes();message('noteMsg','குறிப்பு நீக்கப்பட்டது')};row.append(s,b);root.append(row)})}
$('saveNote').addEventListener('click',()=>{try{let v=$('note').value.trim();if(!v){message('noteMsg','முதலில் குறிப்பை எழுதுங்கள்',true);return}notes.unshift(v);if(!save('vision_notes',notes)){notes.shift();message('noteMsg','Browser சேமிப்பு அனுமதி இல்லை',true);return}$('note').value='';renderNotes();message('noteMsg','✓ குறிப்பு வெற்றிகரமாகச் சேமிக்கப்பட்டது')}catch(e){message('noteMsg','பிழை: '+e.message,true)}});
renderNotes();
let reminders=load('vision_reminders'),done=new Set();
function renderRem(){let root=$('reminders');root.replaceChildren();reminders.forEach((r,i)=>{let row=document.createElement('div');row.className='item';let s=document.createElement('span');s.textContent=r.text+' — '+new Date(r.when).toLocaleString('ta-IN');let b=document.createElement('button');b.textContent='நீக்கு';b.onclick=()=>{reminders.splice(i,1);save('vision_reminders',reminders);renderRem()};row.append(s,b);root.append(row)})}
$('addRem').onclick=()=>{let t=$('remText').value.trim(),w=$('remTime').value;if(!t||!w){say('நினைவூட்டல் விவரங்களை நிரப்புங்கள்');return}reminders.push({text:t,when:new Date(w).getTime()});save('vision_reminders',reminders);$('remText').value='';$('remTime').value='';renderRem();say('நினைவூட்டல் சேர்க்கப்பட்டது')};renderRem();
setInterval(()=>reminders.forEach((r,i)=>{if(r.when<=Date.now()&&!done.has(i)){done.add(i);say('நினைவூட்டல்: '+r.text)}}),15000);
$('speak').onclick=()=>say('வணக்கம்! மைக்ரோஃபோனை அழுத்திப் பேசுங்கள்');
$('google').onclick=()=>{let q=prompt('எதை Google-ல் தேட வேண்டும்?');if(q)open('https://www.google.com/search?q='+encodeURIComponent(q),'_blank')};
$('music').onclick=()=>{let q=prompt('எந்த தமிழ் பாடல்?');if(q)open('https://www.youtube.com/results?search_query='+encodeURIComponent(q+' Tamil song'),'_blank')};
$('call').onclick=()=>{let n=prompt('தொலைபேசி எண்');if(n)location.href='tel:'+n.replace(/[^0-9+]/g,'')};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
$('mic').onclick=()=>{if(!SR){say('இந்த Browser-ல் குரல் அடையாளம் காணும் வசதி கிடைக்கவில்லை.');return}let r=new SR();r.lang='ta-IN';r.onstart=()=>$('hint').textContent='கேட்டுக்கொண்டிருக்கிறேன்...';r.onend=()=>$('hint').textContent='மைக்ரோஃபோனை அழுத்திப் பேசுங்கள்';r.onerror=()=>say('குரலைப் புரிந்துகொள்ள முடியவில்லை');r.onresult=e=>{let t=e.results[0][0].transcript;$('hint').textContent='நீங்கள் சொன்னது: '+t;if(t.includes('நேரம்'))say('இப்போது நேரம் '+new Date().toLocaleTimeString('ta-IN'));else if(t.includes('தேதி'))say('இன்றைய தேதி '+new Date().toLocaleDateString('ta-IN'));else say('நீங்கள் சொன்னது: '+t)};r.start()};
$('mode').textContent=navigator.onLine?'ONLINE':'OFFLINE MODE';window.addEventListener('online',()=>$('mode').textContent='ONLINE');window.addEventListener('offline',()=>$('mode').textContent='OFFLINE MODE');
})();
</script></body></html>
