<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020817"><title>VISION AI</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Arial,Helvetica,sans-serif;color:#fff;background:radial-gradient(ellipse at 50% 100%,#07509b 0%,#03152e 37%,#01040b 76%);position:relative}
body:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#000 0%,transparent 32%,transparent 70%,#1677d544 100%);pointer-events:none}
.screen{height:100svh;min-height:560px;max-width:600px;margin:auto;position:relative;display:flex;flex-direction:column;align-items:center;padding:0 22px}
.orb-area{height:38%;width:100%;display:flex;justify-content:center;align-items:flex-start;position:relative;padding-top:2vh}
.orb{position:relative;width:min(70vw,300px);height:min(70vw,300px);max-height:34vh;max-width:34vh;border-radius:50%;margin-top:-2vh;
background:radial-gradient(ellipse at 65% 25%,#bffaff 0%,#62dcff 8%,#207cff 23%,#071b59 49%,#02091f 68%,transparent 72%);
filter:drop-shadow(0 0 18px #288bff) drop-shadow(0 0 42px #176bff88);animation:float 5s ease-in-out infinite}
.orb:before{content:"";position:absolute;inset:1% -5%;border-radius:50%;border:3px solid transparent;border-top-color:#7ceaff;border-right-color:#3b9dff;border-bottom-color:#1649ba;transform:rotate(-24deg);filter:blur(1px);box-shadow:0 -4px 15px #49caff}
.orb:after{content:"";position:absolute;inset:9% -1%;border-radius:50%;border:2px solid transparent;border-left-color:#237eff;border-bottom-color:#8beeff;transform:rotate(36deg);filter:blur(1px)}
@keyframes float{0%,100%{transform:translateY(0) scale(.98)}50%{transform:translateY(8px) scale(1.03)}}
body.listening .orb{animation:pulse .55s ease-in-out infinite alternate;filter:drop-shadow(0 0 28px #54eaff) drop-shadow(0 0 70px #168bff)}
body.thinking .orb{animation:rotate 1.5s linear infinite}
body.speaking .orb{animation:pulse .32s ease-in-out infinite alternate;filter:drop-shadow(0 0 34px #8cf7ff) drop-shadow(0 0 85px #278bff)}
@keyframes pulse{to{transform:scale(1.13)}}
@keyframes rotate{to{transform:rotate(360deg) scale(.97)}}
.welcome{position:absolute;top:39%;width:100%;text-align:center;padding:0 10px}
.greeting{font-size:clamp(22px,6vw,28px);font-weight:400;color:#d8deea;margin-bottom:42px;text-shadow:0 2px 10px #000}
h1{font-size:clamp(37px,9vw,54px);font-weight:500;line-height:1.16;letter-spacing:-1.7px;margin:0 auto;max-width:520px;text-shadow:0 2px 12px #000}
.response{font-size:16px;line-height:1.6;color:#e4f1ff;max-width:480px;margin:20px auto 0;display:none;text-shadow:0 2px 8px #000}
.bottom{position:absolute;left:5%;right:5%;bottom:calc(28px + env(safe-area-inset-bottom));height:94px;border-radius:60px;border:2px solid #a3d7ff55;background:linear-gradient(180deg,#327dc855,#8dcaff66);box-shadow:0 0 25px #258cff66,inset 0 2px 14px #d2f4ff55;display:flex;align-items:center;padding:0 28px 0 34px;backdrop-filter:blur(14px)}
.bottom input{border:0;outline:0;background:transparent;color:white;font-size:20px;width:100%;min-width:0}
.bottom input::placeholder{color:#edf7ff}
.voice{border:0;background:transparent;color:#effbff;width:58px;height:58px;flex:none;font-size:0;display:flex;align-items:center;justify-content:center;gap:4px}
.voice i{display:block;width:4px;border-radius:5px;background:#e9fbff;box-shadow:0 0 9px #b5f5ff}
.voice i:nth-child(1),.voice i:nth-child(5){height:13px}.voice i:nth-child(2),.voice i:nth-child(4){height:27px}.voice i:nth-child(3){height:42px}
body.listening .voice i,body.speaking .voice i{animation:bars .45s ease-in-out infinite alternate}
body.listening .voice i:nth-child(2),body.speaking .voice i:nth-child(2){animation-delay:.1s}
body.listening .voice i:nth-child(3),body.speaking .voice i:nth-child(3){animation-delay:.2s}
@keyframes bars{to{transform:scaleY(.35)}}
.state{position:absolute;bottom:calc(140px + env(safe-area-inset-bottom));font-size:12px;letter-spacing:2px;color:#b8dfff;opacity:.8}
@media(max-height:650px){.orb-area{height:34%}.orb{width:210px;height:210px}.welcome{top:37%}.greeting{margin-bottom:24px}.bottom{height:76px;bottom:16px}}
</style></head>
<body><main class="screen">
<div class="orb-area"><div class="orb" aria-label="VISION AI animated orb"></div></div>
<section class="welcome"><div class="greeting" id="greeting">Hello</div><h1 id="headline">How can I help<br>you today?</h1><div class="response" id="response" aria-live="polite"></div></section>
<div class="state" id="state">READY</div>
<div class="bottom"><input id="prompt" placeholder="Ask anything..." autocomplete="off"><button class="voice" id="mic" aria-label="Speak"><i></i><i></i><i></i><i></i><i></i></button></div>
</main>
<script>
const $=id=>document.getElementById(id);let rec;
function setState(s){document.body.classList.remove('listening','thinking','speaking');if(s!=='ready')document.body.classList.add(s);$('state').textContent=s.toUpperCase();}
function say(t){$('response').style.display='block';$('response').textContent=t;$('headline').innerHTML='';if(!('speechSynthesis'in window)){setState('ready');return}
speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ta-IN';let v=speechSynthesis.getVoices().find(x=>x.lang.toLowerCase().startsWith('ta'));if(v)u.voice=v;u.onstart=()=>setState('speaking');u.onend=()=>setState('ready');u.onerror=()=>setState('ready');speechSynthesis.speak(u);}
function run(t){if(!t.trim())return;setState('thinking');$('greeting').textContent='You said';$('headline').textContent=t;$('response').style.display='none';setTimeout(()=>{let x=t.toLowerCase(),a;
if(/வணக்கம்|hello|hi/.test(x))a='வணக்கம்! நான் VISION AI. உங்களுக்கு எப்படி உதவலாம்?';
else if(/தேதி|date|நாள்/.test(x))a='இன்றைய தேதி: '+new Date().toLocaleDateString('ta-IN',{dateStyle:'full'});
else if(/நேரம்|time/.test(x))a='உங்கள் தொலைபேசியில் இப்போது '+new Date().toLocaleTimeString('ta-IN')+' மணி.';
else if(/google|கூகுள்|தேடு|search/.test(x)){window.open('https://www.google.com/search?q='+encodeURIComponent(t),'_blank');a='Google தேடலைத் திறக்கிறேன்.'}
else if(/youtube|யூடியூப்|பாடல்|பாட்டு|song/.test(x)){window.open('https://www.youtube.com/results?search_query='+encodeURIComponent(t),'_blank');a='YouTube-ல் தேடுகிறேன்.'}
else a='உங்கள் கேள்வியைப் பெற்றுள்ளேன். முழுமையான AI பதில்களுக்கு AI சேவையக இணைப்பு தேவை. தற்போது அடிப்படை கட்டளைகளைச் சோதிக்கலாம்.';
say(a)},350)}
$('mic').onclick=()=>{let S=window.SpeechRecognition||window.webkitSpeechRecognition;if(!S){say('இந்த browser-ல் குரல் உள்ளீடு ஆதரிக்கப்படவில்லை. கீழே தட்டச்சு செய்யலாம்.');return}try{rec=new S();rec.lang='ta-IN';rec.interimResults=true;rec.onstart=()=>{setState('listening');$('greeting').textContent='Listening'};rec.onresult=e=>{let z='';for(let i=e.resultIndex;i<e.results.length;i++)z+=e.results[i][0].transcript;$('headline').textContent=z;if(e.results[e.results.length-1].isFinal)run(z)};rec.onerror=()=>setState('ready');rec.onend=()=>{if(document.body.classList.contains('listening'))setState('ready')};rec.start()}catch(e){setState('ready')}};
$('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'){run($('prompt').value);$('prompt').value=''}});
</script></body></html>
